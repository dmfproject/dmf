# Builds the static site and publishes it to GitHub Pages on every push to main.
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Project site (<user>.github.io/<repo>) -> BASE_PATH=/<repo>.
      # User site (<user>.github.io repo) -> empty. For a custom domain, set BASE_PATH to "".
      - name: Work out the base path
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then echo "BASE_PATH=" >> "$GITHUB_ENV"; else echo "BASE_PATH=/$REPO" >> "$GITHUB_ENV"; fi

      # The pages load their content from the file server in the browser; its URL is built in.
      # Set FILE_SERVER in the repository's
      # Settings -> Secrets and variables -> Actions -> Variables (e.g. https://dmf-admin.vercel.app/)
      - run: npm run build
        env:
          FILE_SERVER: ${{ vars.FILE_SERVER }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
